name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "Error: JAVA_HOME is not set!"
            exit 1
          fi

          RAW_JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Raw Java Version: ${RAW_JAVA_VER}"
          if [ -z "${RAW_JAVA_VER}" ]; then
            echo "Error: Could not detect active Java version!"
            exit 1
          fi

          MAJOR_JAVA_VER=$(echo "${RAW_JAVA_VER}" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: ${MAJOR_JAVA_VER}"

          if ! [[ "${MAJOR_JAVA_VER}" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to parse Java major version from '${RAW_JAVA_VER}'!"
            exit 1
          fi

          if [ "${MAJOR_JAVA_VER}" -lt 17 ]; then
            echo "Error: Active Java major version (${MAJOR_JAVA_VER}) is lower than 17!"
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking Temporary Debug Keystore ==="
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "${KEYSTORE_PATH}" ]; then
            echo "Debug keystore already exists at ${KEYSTORE_PATH}."
          else
            echo "Generating temporary debug keystore at ${KEYSTORE_PATH}..."
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "${KEYSTORE_PATH}" ]; then
            echo "Error: Failed to find or generate ${KEYSTORE_PATH}!"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "Error: Expected APK not found at ${EXPECTED_APK}!"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: ${EXPECTED_APK} exists but is empty (0 bytes)!"
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *) echo "Error: ${EXPECTED_APK} does not have .apk extension!"; exit 1 ;;
          esac

          echo "Confirmed: ${EXPECTED_APK} exists, is a regular non-empty file, and matches expected path."
          ls -lh "${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/release-asset-$(date +%s)"
          mkdir -p "${TEMP_RELEASE_DIR}"

          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -z "${REPO_NAME}" ]; then
            REPO_NAME="app"
          fi

          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_RELEASE_DIR}/${ASSET_NAME}"

          cp -v "app/build/outputs/apk/debug/app-debug.apk" "${DEST_PATH}"

          if [ ! -s "${DEST_PATH}" ]; then
            echo "Error: Release asset ${DEST_PATH} was not copied properly or is empty!"
            exit 1
          fi

          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${DEST_PATH}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "Error: Prepared release asset ${ASSET_PATH} does not exist or is empty!"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ### ATP Browser — Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run Number:** ${{ github.run_number }}
          - **Build Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** `${{ github.sha }}`
          - **Notice:** This APK is intended for testing and development. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF

          echo "Creating release tag: ${TAG_NAME}"
          gh release create "${TAG_NAME}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

          rm -f release_notes.md
          echo "GitHub Release published successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Publishing Succeeded ==="
            gh release view "${TAG_NAME}"
            RELEASE_URL=$(gh release view "${TAG_NAME}" --json url -q .url)
            echo "Release Tag: ${TAG_NAME}"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: ${RELEASE_URL}"
            echo "Asset Name: ${ASSET_NAME}"

            echo "### 🚀 Debug APK Build & Release Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK is ready for download:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Release Page:** [Download APK from GitHub Release](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Filename:** \`${ASSET_NAME}\` (under the release **Assets** section)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup:** The standard GitHub Actions artifact \`app-debug-apk\` is also available for this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=== Warning: GitHub Release Publishing Failed or Skipped ==="
            echo "Warning: Release creation encountered an issue or was skipped."
            echo "The debug APK build completed successfully."
            echo "The Actions artifact named 'app-debug-apk' remains available for download."

            echo "### ⚠️ Debug APK Built (Release Publishing Warning)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Build:** Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact:** The debug APK was uploaded as the GitHub Actions artifact **\`app-debug-apk\`** and is available in the run summary." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Note:** GitHub Release publishing did not complete, but your build artifact is preserved and downloadable." >> "$GITHUB_STEP_SUMMARY"
          fi
